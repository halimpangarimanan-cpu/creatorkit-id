<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CreatorKit ID - AI Content Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #loading {
      display: none;
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    #resultBox {
      display: none;
      margin-top: 25px;
    }

    #result {
      white-space: pre-wrap;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 20px;
      border-radius: 10px;
      line-height: 1.6;
    }

    .error {
      color: #dc2626;
      background: #fef2f2;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>🚀 CreatorKit ID</h1>
  <p>AI Content Generator untuk Kreator Indonesia</p>
</header>

<div class="container">

  <div class="card">

    <h2>Buat Konten dengan AI</h2>

    <label for="topic">Topik Konten</label>
    <input
      type="text"
      id="topic"
      placeholder="Contoh: Tips menghasilkan uang dari YouTube"
    >

    <label for="platform">Platform</label>
    <select id="platform">
      <option value="YouTube Shorts">YouTube Shorts</option>
      <option value="TikTok">TikTok</option>
      <option value="Facebook Reels">Facebook Reels</option>
      <option value="Instagram Reels">Instagram Reels</option>
      <option value="YouTube">YouTube</option>
    </select>

    <label for="style">Gaya Konten</label>
    <select id="style">
      <option value="viral dan menarik">Viral & Menarik</option>
      <option value="edukatif">Edukatif</option>
      <option value="lucu">Lucu</option>
      <option value="dramatis">Dramatis</option>
      <option value="inspiratif">Inspiratif</option>
      <option value="storytelling">Storytelling</option>
    </select>

    <button id="generateBtn" onclick="generateContent()">
      ✨ GENERATE KONTEN
    </button>

    <div id="loading">
      ⏳ Gemini sedang membuat konten...
    </div>

    <div id="resultBox">
      <h2>Hasil Konten</h2>
      <div id="result"></div>
    </div>

  </div>

</div>

<script>

const WORKER_URL =
  "https://creatorkit-ai.halimpangarimanan.workers.dev";

async function generateContent() {

  const topic =
    document.getElementById("topic").value.trim();

  const platform =
    document.getElementById("platform").value;

  const style =
    document.getElementById("style").value;

  const button =
    document.getElementById("generateBtn");

  const loading =
    document.getElementById("loading");

  const resultBox =
    document.getElementById("resultBox");

  const result =
    document.getElementById("result");

  if (!topic) {
    alert("Silakan masukkan topik konten terlebih dahulu.");
    return;
  }

  button.disabled = true;
  loading.style.display = "block";
  resultBox.style.display = "none";
  result.innerText = "";

  try {

    const response = await fetch(WORKER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        topic: topic,
        platform: platform,
        style: style
      })

    });

    const data = await response.json();

    if (data.status !== "OK") {

      throw new Error(
        data.message ||
        "Gemini gagal menghasilkan konten."
      );

    }

    result.innerText = data.result;

    resultBox.style.display = "block";

  } catch (error) {

    resultBox.style.display = "block";

    result.innerHTML =
      '<div class="error">' +
      "❌ Gagal membuat konten.<br><br>" +
      error.message +
      "</div>";

  } finally {

    button.disabled = false;
    loading.style.display = "none";

  }

}

</script>

</body>
</html>
